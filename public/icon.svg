<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00A896"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <g transform="translate(128, 140)">
    <!-- Layer 1: Graduation Cap / Tech Layer -->
    <path d="M 128 0 L 256 64 L 128 128 L 0 64 Z" fill="url(#accentGrad)" filter="url(#glow)" opacity="0.95" />
    
    <!-- Layer 2: Middle Stack -->
    <path d="M 32 96 L 128 144 L 224 96 L 224 128 L 128 176 L 32 128 Z" fill="#FFFFFF" opacity="0.7"/>
    
    <!-- Layer 3: Bottom Stack -->
    <path d="M 64 144 L 128 176 L 192 144 L 192 168 L 128 200 L 64 168 Z" fill="#FFFFFF" opacity="0.4"/>
    
    <!-- Tassel / Node Element -->
    <path d="M 216 84 L 216 156" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="216" cy="176" r="16" fill="url(#accentGrad)"/>
  </g>
</svg>